name: windcast-agent

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: windcast
      POSTGRES_PASSWORD: windcast
      POSTGRES_DB: windcast
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windcast -d windcast"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://windcast:windcast@db:5432/windcast
      DATA_DIR: /app/data
      REPORTS_DIR: /app/reports
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
