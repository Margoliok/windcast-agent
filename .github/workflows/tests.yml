name: Backend tests

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SCHEDULER_ENABLED: "false"
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Оқытылған модельдер репода жоқ — оларға тәуелді тесттер өткізіледі (skip),
      # физика, метрикалар, шлюз, SCADA парсері, құралдар және API тексеріледі.
      - run: pytest -q
